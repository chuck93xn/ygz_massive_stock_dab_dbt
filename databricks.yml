# Databricks Asset Bundle - root config.
# Run `databricks bundle validate` / `databricks bundle deploy -t dev` from
# this directory once VENDOR_API_BASE_URL etc. and the workspace hosts below
# are filled in.

bundle:
  name: ygz-massive-stock-pipeline

include:
  - resources/*.yml

# Builds the ingestion wheel so python_wheel_task in resources/jobs.yml has
# something to install. `databricks bundle deploy` builds this automatically.
artifacts:
  ingestion_wheel:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog used by all four layers (landing/bronze/silver/gold)
    default: ygz_massive_stock_dev
  landing_schema:
    default: landing
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  landing_volume_path:
    description: Unity Catalog Volume path raw vendor JSON is appended to
    default: /Volumes/ygz_massive_stock_dev/landing/raw
  warehouse_id:
    description: SQL warehouse the dbt_task connects through
    default: "04147fab6edc9014"  # "2x Small serverless Warehouse" in the DBT workspace

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405607192769716.16.azuredatabricks.net

  staging:
    mode: production
    workspace:
      host: https://REPLACE_WITH_STAGING_WORKSPACE.cloud.databricks.com
    variables:
      catalog: staging_catalog
      landing_volume_path: /Volumes/staging_catalog/landing/raw

  prod:
    mode: production
    workspace:
      host: https://REPLACE_WITH_PROD_WORKSPACE.cloud.databricks.com
    variables:
      catalog: prod_catalog
      landing_volume_path: /Volumes/prod_catalog/landing/raw
    run_as:
      service_principal_name: REPLACE_WITH_PROD_SERVICE_PRINCIPAL
