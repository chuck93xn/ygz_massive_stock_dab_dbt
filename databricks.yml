# Databricks Asset Bundle - root config.
# Run `databricks bundle validate` / `databricks bundle deploy -t dev` from
# this directory once VENDOR_API_BASE_URL etc. and the workspace hosts below
# are filled in.

bundle:
  name: ygz-massive-stock-pipeline

include:
  - resources/*.yml

# Builds the ingestion wheel so python_wheel_task in resources/jobs.yml has
# something to install. `databricks bundle deploy` builds this automatically.
artifacts:
  ingestion_wheel:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog used by all four layers (landing/bronze/silver/gold)
    default: ygz_massive_stock_dev
  landing_schema:
    default: landing
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  landing_volume_path:
    description: Unity Catalog Volume path raw vendor JSON is appended to
    default: /Volumes/ygz_massive_stock_dev/landing/raw_massive_data
  warehouse_id:
    description: SQL warehouse the dbt_task connects through
    default: "04147fab6edc9014"  # "2x Small serverless Warehouse" in the DBT workspace

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405607192769716.16.azuredatabricks.net

  # prod is deliberately the *same* workspace as dev, just a different UC
  # catalog - no separate workspace, no staging tier, no service principal.
  # This project is a solo/personal pipeline; the point of having a prod
  # target at all is to exercise a real CI/CD deploy flow, not to stand up
  # enterprise-style environment isolation. See
  # plan/records/08_cicd_simplification_process.md for the reasoning.
  prod:
    mode: production
    workspace:
      host: https://adb-7405607192769716.16.azuredatabricks.net
      # mode: production requires an explicit, fixed root_path (unlike dev,
      # which auto-generates one per developer) so there's exactly one
      # canonical deployment, not a new copy per person who runs deploy.
      root_path: /Workspace/Users/106018876@student.swin.edu.au/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ygz_massive_stock_prod
      landing_volume_path: /Volumes/ygz_massive_stock_prod/landing/raw_massive_data
