resources:
  jobs:
    # ingestion_daily_job/ingestion_reference_job live under
    # targets.dev.resources.jobs in databricks.yml, not here - see the
    # comment there. promote_from_dev_job lives under
    # targets.test.resources.jobs/targets.prod.resources.jobs, same reason.
    # dbt_job is the only job safe/intended to run against every target
    # (pure SQL transforms, no external side effects), so it's the only one
    # left in this shared file.
    dbt_job:
      name: "[${bundle.target}] stock_dbt_silver_gold"
      description: >-
        Phase 1, stage 2: runs dbt Core to build the Silver and Gold layers
        on top of the Bronze Delta tables.
      tags:
        project: ygz-massive-stock
        layer: silver-gold
      tasks:
        - task_key: dbt_build
          depends_on: []
          environment_key: dbt_env
          dbt_task:
            project_directory: ../dbt
            commands:
              - "dbt deps"
              - "dbt build"
            catalog: "${var.catalog}"
            schema: "${var.silver_schema}"
            warehouse_id: "${var.warehouse_id}"
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - "dbt-databricks>=1.7,<2.0"
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

    # TODO (phase 2): streaming_aggregation_job driven by Polygon/vendor
    # WebSocket -> Databricks Structured Streaming -> real-time agg tables.
