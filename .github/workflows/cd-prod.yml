name: CD 2 - deploy prod (manual only)

on:
  workflow_dispatch: {}

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    # Only trigger for this job is workflow_dispatch - deploying prod is a
    # deliberate human action, not something that follows automatically
    # from a push. No `needs: test` here: by the time you're triggering
    # this, the commit on main already passed CI (ci-dev.yml / cd-test.yml's
    # `test` job on push) - re-running pytest adds no new signal.
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        run: databricks bundle validate -t prod
      - name: Deploy bundle
        run: databricks bundle deploy -t prod
