name: test

# Pure pytest gate - no Databricks connection, no secrets. Deliberately
# separate from .github/workflows-disabled/deploy-*.yml, which need real
# staging/prod workspaces + DATABRICKS_HOST_*/TOKEN_* secrets that don't
# exist yet (see .github/workflows-disabled/README.md). This one only needs
# a plain Python environment, so it can run today.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v
