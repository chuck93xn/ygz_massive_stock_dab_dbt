name: Deploy (staging)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t staging

      - name: Deploy bundle
        run: databricks bundle deploy -t staging

      - name: Run ingestion + dbt jobs
        run: |
          databricks bundle run ingestion_daily_job -t staging
          databricks bundle run ingestion_reference_job -t staging
          databricks bundle run dbt_job -t staging
